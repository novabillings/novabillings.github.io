classes:
 - title: "Youth Audition Workshop"
   schedule: "10:00 AM - 12:30 PM"
   dates: "12/05/2026"
   price: "$50"
   age_group: "Ages 6-16"
   description: "Get ready to shine at your next audition! In this workshop students will learn what to expect at a typical NOVA audition and will be taught basic dance combinations, how to prepare an audition songbook, and practice techniques for cold reads and monologues. Feedback will be given by three NOVA teachers and directors Caydance Billings, Janie Sutton, and DeLaney Hardy Ray."
   registration_url: "https://novabillings.ludus.com/200555313"

 - title: "What's Behind the Curtain: A Youth Stage Management Workshop"
   schedule: "10:00 AM - 12:00 PM"
   dates: "01/23/2027"
   price: "$50"
   description: "Students will gain hands-on experience for stage managing focusing on organization, backstage etiquette, interpersonal communication, and more!"
   registration_url: "https://novabillings.ludus.com/200556421"

 - title: "Spring Classes - Creative Drama"
   age_group: "Ages 4-6"
   schedule: "Tuesdays 4:00 PM - 5:00 PM"
   price: "$180"
   description: "In Creative Drama students will take what they learned in Storytime Theater and build on it. Students will be introduced to their “Actor’s Toolkit (body, voice and imagination)”. Also, using drama games and exercises, students will learn how to work as an ensemble and how to tell a story."
   registration_url: "https://novabillings.ludus.com/200557504"

 - title: "Spring Classes - Intro to Theater"
   age_group: "Ages 9-12"
   schedule: "Tuesdays 5:15 PM - 6:15 PM"
   price: "$200" 
   description: "In Intro to Theater students will get a crash course in many different types of theater including improv, puppetry, reader’s theater, miming, to name a few. They will also learn other skills needed in theater such as projection, enunciation, backstage etiquette, and more!"
   registration_url: "https://novabillings.ludus.com/200557507"

 - title: "Spring Classes - Directing"
   age_group: "Ages 10+"
   schedule: "Wednesdays 3:45 PM - 4:45 PM"
   price: "$200"
   description: "In this class students will learn what directing is, “translating a story into what people see and hear.” Using games and exercises students will learn how to break down a script and how to clearly and positively communicate an idea."
   registration_url: "https://novabillings.ludus.com/200557855"

 - title: "Spring Classes - Musical Theater"
   age_group: "Ages 6+"
   schedule: "Thursday 3:45 PM - 5:15 PM"
   price: "$225"
   description: "Acting, singing, dancing, oh my! In this class students will learn how to become a triple threat! Students will learn the basics of musical theater while learning music and choreography for a selection of songs."
   registration_url: "https://novabillings.ludus.com/200557511"

 - title: "Spring Classes - Beginner Acting"
   age_group: "Ages 8+"
   schedule: "Thursdays 4:00 PM - 5:00 PM"
   price: "$200"
   description: "In Beginner Acting students will apply what has been learned so far in Creative Drama and Intro to Theater. Using short scenes students will learn how to read a script, move on the stage, take direction and more while using their Actor's Toolkit (body, voice, and imagination.)"
   registration_url: "https://novabillings.ludus.com/200557509"

 - title: "Spring Classes - Storytime Theater"
   age_group: "Ages 3-5"
   schedule: "Fridays 3:45 PM - 4:15 PM"
   price: "Donations Accepted"
   description: "In Storytime Theater students will be introduced to the world of theater through storytelling! The class will include group games,songs, and a craft."
   registration_url: "https://novabillings.ludus.com/200557866"
  