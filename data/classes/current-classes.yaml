 - title: "Fall Classes - Storytime Theater (Per Week)"
   schedule: "Tuesday - 2:30 PM - 3:15 PM"
   dates: "09/22/2026 to 11/17/2026"
   price: "$20/Week"
   age_group: "Ages 3-5"
   description: "In Storytime Theater students will be introduced to the world of theater through storytelling! The class will include group games and songs, a craft, and a telling of a classic story with the help of the class."
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200534180"

 - title: "Fall Classes - Storytime Theater (Semester)"
   schedule: "Thursday - 2:30 PM - 3:15 PM"
   dates: "09/24/2026 to 11/19/2026"
   price: "$120/Semester"
   age_group: "Ages 3-5"
   description: "In Storytime Theater students will be introduced to the world of theater through storytelling! The class will include group games and songs, a craft, and a telling of a classic story with the help of the class."
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200532876"

 - title: "Fall Classes - Creative Drama"
   schedule: "Tuesday - 4:00 PM - 5:00 PM"
   dates: "09/22/2026 to 11/17/2026"
   price: "$180"
   age_group: "Ages 6-8"
   description: "In Creative Drama students will take what they learned in Storytime Theater and build on it. Students will be introduced to their “Actor’s Toolkit (body, voice and imagination)”. Also, using drama games and exercises, students will learn how to work as an ensemble and how to tell a story."
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200525343"

 - title: "Fall Classes - Intro to Theater"
   schedule: "Tuesday - 5:15 PM - 6:15 PM"
   dates: "09/22/2026 to 11/17/2026"
   price: "$200"
   age_group: "Ages 9-12 (OR has completed a semester of Creative Drama)"
   description: "In Intro to Theater students will get a crash course in many different types of theater including improv, puppetry, reader’s theater, miming, to name a few. They will also learn other skills needed in theater such as projection, enunciation, backstage etiquette, and more!"
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200525347"

 - title: "Fall Classes - Beginner Acting"
   schedule: "Wednesday - 3:45 PM - 4:45 PM"
   dates: "09/23/2026 to 11/18/2026"
   price: "$200"
   age_group: "Ages 8+ (OR has completed a semester of Creative Drama and/or Intro to Theater)"
   description: "In Beginner Acting students will apply what has been learned so far in Creative Drama and Intro to Theater. Using short scenes students will learn how to read a script, move on the stage, take direction and more while using their Actor's Toolkit (body, voice, and imagination.)"
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200525344"

 - title: "Fall Classes - Intermediate Acting"
   schedule: "Thursday - 5:00 PM - 6:00 PM"
   dates: "09/24/2026 to 11/19/2026"
   price: "$200"
   age_group: "Ages 10+ (OR has participated in a NOVA camp or production)"
   description: "In Intermediate Acting students will build on the skills developed in Beginner Acting. Using short scenes or monologues students will work on their stage presence, learn how to memorize, develop a character, and more!"
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200525349"

 - title: "Fall Classes - Musical Theater"
   schedule: "Thursday - 3:45 PM - 4:45 PM"
   dates: "09/24/2026 to 11/19/2026"
   price: "$225"
   age_group: "Ages 6+ (must have completed a semester of Creative Drama)"
   description: "Acting, singing, dancing, oh my! In this class students will learn how to become a triple threat! Students will learn the basics of musical theater while learning music and choreography for a selection of songs."
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200525350"

 - title: "Fall Classes - Improv"
   schedule: "Thursday - 4:00 PM - 5:00 PM"
   dates: "09/24/2026 to 11/19/2026"
   price: "$150"
   age_group: "Ages 10+"
   description: "Yes, And! Learn how to create a scene out of thin air in this fun fast paced class. Students will learn the basics of improvisational theater while developing important skills they can take into the real world."
   instructor: "TBD"
   registration_url: "https://novabillings.ludus.com/200532890"

